name: CloudForge - Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: CloudForge Build Engine
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute CloudForge
        run: python core/build_manager.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudforge-build
          path: dist/
